[project]
name = "call-calendar"
version = "0.1.0"
description = "Call calendar API scaffold"
requires-python = ">=3.13"
dependencies = [
  "alembic==1.20.1",
  "email-validator==2.3.0",
  "fastapi==0.162.0",
  "psycopg[binary]==3.3.6",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "sqlalchemy[asyncio]==2.1.6",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "datamodel-code-generator==0.87.0",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "mypy==2.4.1",
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "pyyaml==6.0.3",
  "ruff==0.17.3",
  "types-jsonschema==4.26.0.20261006",
  "types-pyyaml==6.0.12.20261030",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["backend/app/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["backend"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires a dedicated PostgreSQL test database"]

